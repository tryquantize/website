# Development docker-compose configuration with hot-reloading

services:
  # Web - Next.js application
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: quantize-web-dev
    hostname: localhost
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - quantize-network
    restart: unless-stopped

  # AI Service - Python Flask application for AI-powered search
  ai-service:
    build:
      context: ./packages/ai-service
      dockerfile: Dockerfile
    container_name: quantize-ai-service-dev
    ports:
      - "5002:5002"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5002
      - FLASK_DEBUG=true
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
    volumes:
      - ./packages/ai-service:/app
      - ai-venv:/app/venv
      - pip-cache:/root/.cache/pip
    networks:
      - quantize-network
    restart: unless-stopped
    # Bootstrap venv if missing, install deps, then run
    command: >
      sh -c '
      if [ ! -f venv/bin/python ]; then
        echo "--- Creating Python virtual environment ---";
        python3 -m venv venv;
      fi;
      echo "--- Installing dependencies ---";
      venv/bin/pip install -q -r requirements.txt;
      echo "--- Starting AI service ---";
      exec venv/bin/python app.py
      '

networks:
  quantize-network:
    driver: bridge

volumes:
  ai-venv:
  pip-cache:
  yarn-cache:
