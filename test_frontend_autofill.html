<!DOCTYPE html>
<html>
<head>
    <title>Test Autofill Frontend</title>
</head>
<body>
    <h1>Test Autofill API Response Handling</h1>
    <button onclick="testAutofill()">Test NextQuark Autofill</button>
    <div id="result"></div>

    <script>
        async function testAutofill() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('http://localhost:5002/auto-fill-company', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        companyName: 'nextquark',
                        website: 'https://nextquark.in/',
                        linkedinPage: 'https://www.linkedin.com/company/nextquark/'
                    })
                });
                
                const result = await response.json();
                
                // Simulate the frontend processing
                if (result.success && result.data) {
                    const autoFilledData = { ...result.data };
                    
                    // Process data like the frontend does
                    const processedData = {
                        phoneNumber: autoFilledData.phoneNumber || '',
                        founded: autoFilledData.founded || '',
                        headquarters: autoFilledData.headquarters || '',
                        products: Array.isArray(autoFilledData.products) ? autoFilledData.products : [],
                        description: autoFilledData.description || '',
                        category: autoFilledData.category || '',
                        employees: autoFilledData.employees || '',
                        industriesServed: Array.isArray(autoFilledData.industriesServed) ? autoFilledData.industriesServed : [],
                        pricingRanges: Array.isArray(autoFilledData.pricingRanges) ? autoFilledData.pricingRanges : [],
                        pricingModel: Array.isArray(autoFilledData.pricingModel) ? autoFilledData.pricingModel : [],
                        features: typeof autoFilledData.features === 'string' ? autoFilledData.features : 
                                 Array.isArray(autoFilledData.features) ? autoFilledData.features.join(', ') : '',
                        useCases: typeof autoFilledData.useCases === 'string' ? autoFilledData.useCases : 
                                 Array.isArray(autoFilledData.useCases) ? autoFilledData.useCases.join(', ') : '',
                        companyStage: autoFilledData.companyStage || '',
                        topClients: Array.isArray(autoFilledData.topClients) ? autoFilledData.topClients : []
                    };
                    
                    resultDiv.innerHTML = `
                        <h2>✅ Success! No crashes detected</h2>
                        <p><strong>Message:</strong> ${result.message}</p>
                        <p><strong>Sources:</strong> ${result.sources_used?.join(', ')}</p>
                        <p><strong>Fields Filled:</strong> ${result.fields_filled}</p>
                        <h3>Processed Data:</h3>
                        <pre>${JSON.stringify(processedData, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<h2>⚠️ Partial Success</h2><p>${result.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<h2>❌ Error</h2><p>${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
