services:
  ai-service:
    build: ./apps/ai-service
    ports:
      - "5002:5002"
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    environment:
      - AI_SERVICE_URL=http://ai-service:5002
    depends_on:
      ai-service:
        condition: service_healthy