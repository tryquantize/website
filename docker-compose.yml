version: '3.8'

services:
  # Web - Next.js application
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: quantize-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    networks:
      - quantize-network
    restart: unless-stopped

  # AI Service - Python Flask application for AI-powered search
  ai-service:
    build:
      context: ./packages/ai-service
      dockerfile: Dockerfile
    container_name: quantize-ai-service
    ports:
      - "5002:5002"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5002
      - FLASK_DEBUG=false
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
    networks:
      - quantize-network
    restart: unless-stopped

networks:
  quantize-network:
    driver: bridge

volumes:
  my-volume:
    driver: local
