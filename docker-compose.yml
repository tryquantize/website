version: '3.8'

services:
  # AI Service - Python Flask application for AI-powered search
  ai-service:
    build:
      context: ./packages/ai-service
      dockerfile: Dockerfile
    container_name: quantize-ai-service
    ports:
      - "5002:5002"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5002
      - FLASK_DEBUG=false
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
    networks:
      - quantize-network
    restart: unless-stopped

      timeout: 10s
      retries: 3
      start_period: 40s

  # Server - Node.js Express backend
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: quantize-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - AI_SERVICE_URL=http://ai-service:5002
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - quantize-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Client - React application served by Nginx
  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
    container_name: quantize-client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - quantize-network
    restart: unless-stopped

networks:
  quantize-network:
    driver: bridge

volumes:
  my-volume:
    driver: local
